name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Tests use a scripted fake chat model; a dummy key only satisfies Settings.
      LLM_API_KEY: test-key
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.27"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Tests
        run: uv run pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tripmate:ci .
