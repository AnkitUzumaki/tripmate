[project]
name = "tripmate"
version = "0.1.0"
description = "Agentic AI travel assistant with RAG and weather tools"
requires-python = ">=3.10"
dependencies = [
    "litellm>=1.50",
    "chromadb>=0.5",
    "fastembed>=0.4",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "diskcache>=5.6",
    "structlog>=24.4",
    "rich>=13.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "respx>=0.21"]
evals = ["ragas>=0.2", "datasets>=3.0"]

[project.scripts]
tripmate = "tripmate.adapters.cli:main"
tripmate-ingest = "tripmate.rag.ingest:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tripmate"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "slow: requires a live LLM provider",
]

[tool.coverage.run]
source = ["src/tripmate"]
omit = ["*/adapters/cli.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
